name: Deploy to staging

on:
  push:
    branches:
      - main

jobs:
  # ideally we should not deploy all together and rather deploy all three separately
  redeploy_everything:
    name: Deploying everything to the staging cluster
    runs-on: ubuntu-latest

    steps:
      - name: SSH Into server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 13.61.155.151 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 ubuntu@13.61.155.151 '
            cd ~/devops100xdevs-week25.2 && \
            git pull && \
            yarn install && \
            yarn run build && \
            pm2 restart http-server && \
            pm2 restart fe-server && \
            pm2 restart ws-server
          '

