name: Deploy to staging

on:
  push:
    branches:
      - main

jobs:
  redeploy_everything:
    name: Deploying everything to the staging cluster
    runs-on: ubuntu-latest

    steps:
      - name: SSH Into server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 13.61.155.151 >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 ubuntu@13.61.155.151 '
            cd ~/devops100xdevs-week25.2 && \
            git pull origin main && \
            export NVM_DIR="$HOME/.nvm" && \
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi && \
            nvm use 24 >/dev/null 2>&1 || true && \
            npm install -g yarn@1.22.22 >/dev/null 2>&1 || true && \
            npm install -g pm2 >/dev/null 2>&1 || true && \
            export PATH="$PATH:$(npm prefix -g 2>/dev/null || echo /usr/local)/bin" && \
            yarn install --frozen-lockfile && \
            yarn build && \
            pm2 restart http-server || pm2 start "node /home/ubuntu/devops100xdevs-week25.2/apps/http-server/dist/index.js" --name http-server && \
            pm2 restart fe-server || pm2 start "yarn --cwd /home/ubuntu/devops100xdevs-week25.2/apps/web start" --name fe-server && \
            pm2 restart ws-server || pm2 start "node /home/ubuntu/devops100xdevs-week25.2/apps/ws-server/dist/index.js" --name ws-server
          '

